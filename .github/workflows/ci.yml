name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, the tests and a release build: what `mise run lint test bundle` does locally.
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test

      - name: Release build
        run: mise run bundle

  # The docs build as docs.yml publishes it, without publishing.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build documentation
        uses: elastic/docs-builder@main
