<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<!-- The Note tab: loaded from the app bundle with loadFileURL; nothing here reaches the network. -->
<style>
  :root {
    --heed-bg: #0c0d0f;
    --heed-bg2: #12141a;
    --heed-bg3: #1a1d24;
    --heed-line: #272b30;
    --heed-fg: #d4d4d4;
    --heed-fg2: #a0a4b0;
    --heed-fg3: #666c7a;
    --heed-code: #e0e2e8;
    --heed-muted: #666c7a;
    --heed-link: #6b9bd2;
    --heed-added: #4caf7a;
    --heed-selection: rgba(99,153,210,0.3);
    --heed-syntax-keyword: #c792ea;
    --heed-syntax-string: #c3e88d;
    --heed-syntax-number: #f78c6c;
    --heed-syntax-comment: #546e7a;
    --heed-syntax-type: #89ddff;
    --heed-syntax-function: #82aaff;
    --heed-syntax-tag: #80cbc4;
    --heed-font: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --heed-ui-font: -apple-system, system-ui, sans-serif;
    --heed-font-size: 12px;
    --note-width: 720px;
    --note-padding: 24px;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--heed-bg);
    color: var(--heed-fg);
    font-family: var(--heed-ui-font);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  #content {
    max-width: var(--note-width);
    margin: 0 auto;
    padding: var(--note-padding);
  }

  /* ── Typography ── */
  h1, h2, h3, h4, h5, h6 {
    font-weight: 600;
    line-height: 1.25;
    margin: 1.5em 0 0.5em;
    color: var(--heed-fg);
  }
  h1 { font-size: 1.75em; border-bottom: 1px solid var(--heed-line); padding-bottom: 0.3em; margin-top: 0; }
  h2 { font-size: 1.3em; border-bottom: 1px solid var(--heed-line); padding-bottom: 0.2em; }
  h3 { font-size: 1.1em; }
  p { margin: 0.6em 0; }
  a { color: var(--heed-link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  hr { border: none; border-top: 1px solid var(--heed-line); margin: 1.5em 0; }

  /* ── Lists ── */
  ul, ol { padding-left: 1.6em; margin: 0.5em 0; }
  li { margin: 0.2em 0; }

  /* ── Code ── */
  code {
    font-family: var(--heed-font);
    font-size: var(--heed-font-size);
    background: var(--heed-bg3);
    color: var(--heed-code);
    padding: 0.1em 0.4em;
    border-radius: 3px;
  }
  pre.hljs {
    background: var(--heed-bg2);
    border: 1px solid var(--heed-line);
    border-radius: 6px;
    padding: 1em;
    overflow-x: auto;
    margin: 0.8em 0;
  }
  pre.hljs code {
    background: none;
    padding: 0;
    font-size: var(--heed-font-size);
    color: var(--heed-code);
  }

  /* highlight.js token colours */
  .hljs-keyword, .hljs-selector-tag, .hljs-built_in, .hljs-name, .hljs-tag { color: var(--heed-syntax-keyword); }
  .hljs-string, .hljs-attr, .hljs-regexp, .hljs-template-variable { color: var(--heed-syntax-string); }
  .hljs-number, .hljs-literal { color: var(--heed-syntax-number); }
  .hljs-comment { color: var(--heed-syntax-comment); font-style: italic; }
  .hljs-type, .hljs-class .hljs-title { color: var(--heed-syntax-type); }
  .hljs-function .hljs-title, .hljs-title { color: var(--heed-syntax-function); }
  .hljs-meta, .hljs-selector-pseudo { color: var(--heed-syntax-tag); }
  .hljs-deletion { color: #ef5350; }
  .hljs-addition { color: var(--heed-added); }

  /* ── Tables ── */
  table { border-collapse: collapse; width: 100%; margin: 0.8em 0; font-size: 13px; }
  th, td { border: 1px solid var(--heed-line); padding: 6px 12px; }
  th { background: var(--heed-bg2); font-weight: 600; }
  tr:nth-child(even) { background: var(--heed-bg2); }

  /* ── Blockquote (plain) ── */
  blockquote:not([class]) {
    border-left: 3px solid var(--heed-line);
    margin: 0.8em 0 0.8em 0;
    padding: 0.4em 1em;
    color: var(--heed-fg3);
  }

  /* ── Callouts ── */
  .heed-callout {
    border-radius: 6px;
    border: 1px solid var(--heed-line);
    padding: 10px 14px;
    margin: 0.8em 0;
    background: var(--heed-bg2);
  }
  .heed-callout-title {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--heed-fg2);
  }
  .heed-callout-note   { border-left: 3px solid #6b9bd2; }
  .heed-callout-info   { border-left: 3px solid #6b9bd2; }
  .heed-callout-tip    { border-left: 3px solid #4caf7a; }
  .heed-callout-important { border-left: 3px solid #c792ea; }
  .heed-callout-warning { border-left: 3px solid #f78c6c; }
  .heed-callout-caution { border-left: 3px solid #ef5350; }
  .heed-callout-danger  { border-left: 3px solid #ef5350; }
  .heed-callout-example { border-left: 3px solid #82aaff; }
  .heed-callout-quote   { border-left: 3px solid #80cbc4; }
  .heed-callout-todo    { border-left: 3px solid #f78c6c; }
  /* Remove blockquote > p margin inside callouts */
  .heed-callout > p { margin: 0.3em 0; }

  /* ── Wikilinks ── */
  .heed-wikilink { color: var(--heed-link); cursor: pointer; }
  .heed-wikilink-unresolved { color: var(--heed-muted); text-decoration: line-through; }

  /* ── Tags ── */
  .heed-tag {
    display: inline-block;
    background: var(--heed-bg3);
    color: var(--heed-link);
    border-radius: 3px;
    padding: 1px 6px;
    font-size: 12px;
    margin: 0 1px;
  }

  /* ── Frontmatter properties ── */
  .heed-properties {
    background: var(--heed-bg2);
    border: 1px solid var(--heed-line);
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 1.2em;
    font-size: 13px;
  }
  .heed-property {
    display: flex;
    gap: 10px;
    padding: 3px 0;
    border-bottom: 1px solid var(--heed-line);
  }
  .heed-property:last-child { border-bottom: none; }
  .heed-property-key {
    flex: 0 0 120px;
    color: var(--heed-fg3);
    font-weight: 500;
    text-transform: capitalize;
  }
  .heed-property-value { color: var(--heed-fg); flex: 1; }

  /* ── Task checkboxes ── */
  .heed-task-checkbox { margin-right: 4px; vertical-align: middle; }

  /* ── Highlight ── */
  mark { background: rgba(255, 213, 79, 0.25); color: inherit; padding: 0 2px; border-radius: 2px; }

  /* ── Image embeds ── */
  .heed-embed-image { max-width: 100%; border-radius: 4px; margin: 0.5em 0; }
  .heed-embed {
    border-left: 2px solid var(--heed-line);
    padding-left: 1em;
    margin: 0.6em 0;
    color: var(--heed-fg2);
  }

  /* ── Mermaid ── */
  .heed-mermaid { margin: 0.8em 0; }

  /* ── Footnotes ── */
  .footnotes { font-size: 13px; color: var(--heed-fg2); border-top: 1px solid var(--heed-line); margin-top: 2em; padding-top: 1em; }
</style>
</head>
<body>
<div id="content"></div>
<script src="note.js"></script>
</body>
</html>
